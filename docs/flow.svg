<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="760" height="430" fill="#fbfbfa"/>

  <text x="20" y="26" font-size="12" fill="#6b6b6b">A remote drop. Every arrow is bytes on the tty ssh already owns.</text>

  <rect x="20" y="46" width="200" height="30" rx="4" fill="#e8e6e1" stroke="#8a8578"/>
  <text x="120" y="66" text-anchor="middle" fill="#2d2a2e">terminal (local)</text>
  <rect x="540" y="46" width="200" height="30" rx="4" fill="#e8e6e1" stroke="#8a8578"/>
  <text x="640" y="66" text-anchor="middle" fill="#2d2a2e">shell (remote)</text>

  <line x1="120" y1="76" x2="120" y2="404" stroke="#c4c0b8" stroke-width="2"/>
  <line x1="640" y1="76" x2="640" y2="404" stroke="#c4c0b8" stroke-width="2"/>

  <text x="20" y="104" font-size="12" fill="#8a5a2b">drop</text>

  <line x1="120" y1="124" x2="632" y2="124" stroke="#3f6f4f" stroke-width="2" marker-end="url(#a)"/>
  <text x="376" y="118" text-anchor="middle" fill="#3f6f4f">1. probe: can this end receive, which names are free</text>
  <text x="376" y="140" text-anchor="middle" font-size="11" fill="#6b6b6b">one shell line, leading space, nothing installed</text>

  <line x1="640" y1="174" x2="128" y2="174" stroke="#3f6f4f" stroke-width="2" marker-end="url(#a)"/>
  <text x="376" y="168" text-anchor="middle" fill="#3f6f4f">OSC 1337 SetUserVar=kdrop=ok/notes-1.txt/data-1</text>
  <text x="376" y="190" text-anchor="middle" font-size="11" fill="#6b6b6b">silence within 3 s means the payload is never sent</text>

  <rect x="156" y="208" width="440" height="34" rx="4" fill="#f3efe6" stroke="#b8ae97"/>
  <text x="376" y="230" text-anchor="middle" fill="#5a4a2b">2. one dialog per item: Copy, Keep both, Overwrite, Skip</text>

  <line x1="120" y1="272" x2="632" y2="272" stroke="#3f6f4f" stroke-width="2" marker-end="url(#a)"/>
  <text x="376" y="266" text-anchor="middle" fill="#3f6f4f">3. stty -echo; base64 -d | (tar -xf -; cat &gt;/dev/null)</text>

  <line x1="120" y1="306" x2="632" y2="306" stroke="#3f6f4f" stroke-width="2" marker-end="url(#a)"/>
  <text x="376" y="300" text-anchor="middle" fill="#3f6f4f">tar, base64, 76 columns, then 0x04</text>
  <text x="376" y="322" text-anchor="middle" font-size="11" fill="#6b6b6b">member names are the free names from step 1</text>

  <line x1="640" y1="356" x2="128" y2="356" stroke="#3f6f4f" stroke-width="2" marker-end="url(#a)"/>
  <text x="376" y="350" text-anchor="middle" fill="#3f6f4f">SetUserVar=kdrop=done, or fail on tar's exit status</text>

  <rect x="216" y="374" width="320" height="30" rx="4" fill="#f3efe6" stroke="#b8ae97"/>
  <text x="376" y="394" text-anchor="middle" fill="#5a4a2b">marker clears, or an overlay on failure</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6f4f"/>
    </marker>
  </defs>
</svg>
