<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="700" height="320" fill="#fbfbfa"/>
  <text x="20" y="26" font-size="12" fill="#6b6b6b">One item's dialog, drawn by kitty's ask kitten over the window that received the drop.</text>

  <rect x="20" y="44" width="660" height="256" rx="6" fill="#2d2a2e"/>
  <circle cx="42" cy="66" r="5" fill="#fd6883"/>
  <circle cx="60" cy="66" r="5" fill="#f9cc6c"/>
  <circle cx="78" cy="66" r="5" fill="#adda78"/>
  <text x="350" y="70" text-anchor="middle" font-size="12" fill="#72696a">Copy files</text>
  <line x1="20" y1="84" x2="680" y2="84" stroke="#4a464b"/>

  <text x="44" y="116" fill="#fff1f3">notes.txt (1.2 MB) already exists in</text>
  <text x="44" y="136" fill="#fff1f3">the remote working directory.</text>
  <text x="44" y="156" fill="#fff1f3">Keep both writes notes-1.txt.</text>

  <text x="44" y="208" fill="#f9cc6c">Item 1 of 2. Esc cancels the drop.</text>

  <rect x="44" y="250" width="100" height="26" rx="4" fill="#3a4a34" stroke="#adda78"/>
  <text x="94" y="268" text-anchor="middle" fill="#adda78"><tspan fill="#fff1f3" font-weight="bold">K</tspan>eep both</text>
  <rect x="156" y="250" width="100" height="26" rx="4" fill="#4a3234" stroke="#fd6883"/>
  <text x="206" y="268" text-anchor="middle" fill="#fd6883"><tspan fill="#fff1f3" font-weight="bold">O</tspan>verwrite</text>
  <rect x="268" y="250" width="62" height="26" rx="4" fill="#4a4434" stroke="#f9cc6c"/>
  <text x="299" y="268" text-anchor="middle" fill="#f9cc6c"><tspan fill="#fff1f3" font-weight="bold">S</tspan>kip</text>
  <text x="346" y="268" font-size="11" fill="#72696a">Enter, the letter, or a click. No arrow keys.</text>
</svg>
